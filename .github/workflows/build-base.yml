name: Build base image
# The heavy, rarely changing part of the RunPod image (docker/base.Dockerfile). Runs when
# one of its inputs changes on main, or by hand. Publishes
# ghcr.io/digitrgrs-eng/selfism-dashboard:base-<hash> (scripts/base_image.py) and skips the
# build when that tag already exists. After a new base, pin its digest in the app
# Dockerfile (FROM ...:base-<hash>@sha256:...) and run "Build RunPod image".
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the base tag already exists
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - docker/base.Dockerfile
      - docker/bake_comfyui.sh
      - docker/install_llama_cpp.sh
      - docker/base-constraints.txt
      - docker/base-nodes.json
permissions:
  contents: read
  packages: write
concurrency:
  group: build-base-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the bake inputs
        run: |
          python -m pip install -r requirements-launcher.txt pytest boto3
          python -m pytest tests/test_bake.py tests/test_base_image.py tests/test_sageattention.py tests/test_selfism_runtime.py -q
          python scripts/base_image.py check
      - name: Base tag
        id: tag
        run: echo "tag=$(python scripts/base_image.py tag)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip if this base already exists
        id: exists
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/digitrgrs-eng/selfism-dashboard:${{ steps.tag.outputs.tag }}"
          if [[ "${{ inputs.force }}" != "true" ]] && docker buildx imagetools inspect "$ref" > /tmp/inspect.txt 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            digest=$(awk '/^Digest:/ {print $2; exit}' /tmp/inspect.txt)
            echo "Base $ref already exists ($digest); nothing to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check space for unpacking the base rootfs
        if: steps.exists.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          # Preinstalled SDKs on this disposable hosted runner only.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache
          docker system prune --all --force
          df -h /
          available=$(df -B1 --output=avail / | tail -1 | tr -d ' ')
          # fat stage (~11 GiB base rootfs + ~6 GiB bake) + the flattened copy (~13 GiB) + blobs.
          if (( available < 60 * 1024 * 1024 * 1024 )); then
            echo "::error::Less than 60 GiB free after cleanup."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.exists != 'true'
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Build and publish the base
        id: build
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          platforms: linux/amd64
          push: true
          load: false
          provenance: false
          tags: ghcr.io/digitrgrs-eng/selfism-dashboard:${{ steps.tag.outputs.tag }}
      - name: Record the base digest
        if: steps.exists.outputs.exists != 'true'
        run: |
          echo "Base image: ghcr.io/digitrgrs-eng/selfism-dashboard:${{ steps.tag.outputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin it in Dockerfile: FROM ghcr.io/digitrgrs-eng/selfism-dashboard:${{ steps.tag.outputs.tag }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
