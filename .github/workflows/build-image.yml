name: Build RunPod image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: build-runpod-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check space for registry layer transfer
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup"
          df -h /
          # These are preinstalled SDKs on this disposable hosted runner only.
          # The build reuses upstream CUDA layers without unpacking them.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache
          docker system prune --all --force
          echo "Disk after cleanup"
          df -h /
          available=$(df -B1 --output=avail / | tail -1 | tr -d ' ')
          if (( available < 15 * 1024 * 1024 * 1024 )); then
            echo "::error::Less than 15 GiB free after cleanup. Stop before transferring registry layers."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          load: false
          tags: |
            ghcr.io/digitrgrs-eng/selfism-dashboard:latest
            ghcr.io/digitrgrs-eng/selfism-dashboard:${{ github.sha }}
          build-args: IMAGE_VERSION=${{ github.sha }}
      - name: Record immutable image tag
        run: echo 'RunPod image tag â€” ghcr.io/digitrgrs-eng/selfism-dashboard:${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
