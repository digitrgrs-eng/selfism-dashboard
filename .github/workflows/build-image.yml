name: Build RunPod image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: build-runpod-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check available disk
        run: df -h
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/digitrgrs-eng/selfism-dashboard:latest
            ghcr.io/digitrgrs-eng/selfism-dashboard:${{ github.sha }}
          build-args: IMAGE_VERSION=${{ github.sha }}
      - name: Record immutable image tag
        run: echo 'RunPod image tag — ghcr.io/digitrgrs-eng/selfism-dashboard:${{ github.sha }}' >> "$GITHUB_STEP_SUMMARY"
