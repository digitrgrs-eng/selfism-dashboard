name: Compare images
# Read-only check that a new image kept everything an older one had: pip and apt
# packages, ComfyUI checkout, custom nodes, node packs, image config and every file path.
on:
  workflow_dispatch:
    inputs:
      old:
        description: Old image (e.g. ghcr.io/digitrgrs-eng/selfism-dashboard:<sha>)
        required: true
      new:
        description: New image
        required: true
permissions:
  contents: read
  packages: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache
          docker system prune --all --force
          df -h /
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for which in old new; do
            if [[ "$which" == old ]]; then image="${{ inputs.old }}"; else image="${{ inputs.new }}"; fi
            start=$(date +%s)
            docker pull -q "$image"
            echo "$which pull: $(( $(date +%s) - start ))s" | tee -a out/timings.txt
            docker image inspect "$image" --format '{{json .Config}}' > "out/$which-config.json"
            docker run --rm --entrypoint python3.12 -v "$PWD/scripts:/inv:ro" -v "$PWD/out:/out" "$image" \
              /inv/image_inventory.py "/out/$which.json"
            python3 - "$which" <<'PY'
          import json, sys
          which = sys.argv[1]
          data = json.load(open(f'out/{which}.json'))
          data['config'] = json.load(open(f'out/{which}-config.json'))
          json.dump(data, open(f'out/{which}.json', 'w'))
          PY
            docker image rm -f "$image" > /dev/null
            docker system prune --all --force > /dev/null
          done
      - name: Compare
        run: python3 scripts/compare_images.py out/old.json out/new.json out/report.md
      - name: Summary
        if: always()
        run: |
          cat out/timings.txt >> "$GITHUB_STEP_SUMMARY" || true
          cat out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-inventory
          path: out/
